name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare project
        run: |
          mkdir -p www assets
          H=$(find . -maxdepth 1 -name '*.html' | head -1)
          cp "$H" www/index.html
          if [ -f icon-only.png ]; then cp icon-only.png assets/icon-only.png; else convert -size 1024x1024 xc:'#0a0e1a' -fill '#131a30' -stroke '#00e5ff' -strokewidth 28 -draw 'roundrectangle 200,230 824,670 50,50' -fill '#00e5ff' -stroke none -draw 'rectangle 460,670 564,780' -draw 'roundrectangle 340,780 684,820 20,20' assets/icon-only.png; fi
          echo '{"name":"pc-forge","version":"1.0.0","private":true,"dependencies":{"@capacitor/android":"^6.1.0","@capacitor/cli":"^6.1.0","@capacitor/core":"^6.1.0"},"devDependencies":{"@capacitor/assets":"^3.0.5"}}' > package.json
          echo '{"appId":"com.pcforge.game","appName":"PC FORGE","webDir":"www","backgroundColor":"#0a0e1a"}' > capacitor.config.json
      - run: npm install
      - run: npx cap add android
      - run: npx capacitor-assets generate --android --iconBackgroundColor '#0a0e1a' --iconBackgroundColorDark '#0a0e1a'
      - run: sed -i 's/<activity /<activity android:screenOrientation="sensorLandscape" /' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PC-FORGE-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
